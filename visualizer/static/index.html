<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0d14">
  <meta name="description" content="Visualizador interactivo de ML-KEM (FIPS 203): la implementación real en Python, ejecutada en tu navegador, paso a paso.">
  <title>ML-KEM paso a paso</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fondo de color suave detrás del vidrio (sin dibujo: no compite con el material) -->
  <div class="field" aria-hidden="true"><div class="field-glow"></div></div>

  <a class="skip" href="#explain">Saltar al contenido del paso</a>

  <div class="app">
    <header class="masthead">
      <div class="brand">
        <h1>ML-KEM paso a paso</h1>
        <p class="byline"><span>Criptografía basada en retículos, ejecutada de verdad en tu navegador.</span> <span>TFG de Denis Valentin Stoyanov D'Antonio, Universidad de Granada.</span></p>
      </div>
      <div class="controls">
        <div class="segmented params" id="paramPicker" role="radiogroup" aria-label="Conjunto de parámetros"></div>
        <div class="actions">
          <button id="btnNew" title="Repetir con claves y mensaje nuevos"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg><span>Nueva ejecución</span> <kbd>N</kbd></button>
          <button id="btnTamper" aria-pressed="false" title="Invertir un bit del texto cifrado en el canal"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6l1-7Z"/></svg><span>Manipular c</span> <kbd>M</kbd></button>
        </div>
      </div>
    </header>

    <nav class="stepper" id="stepper" aria-label="Pasos"></nav>

    <main class="stage" id="stage">
      <div id="banner"></div>
      <div class="flow" id="flow"></div>
      <div class="step-grid">
        <article class="explain" id="explain" tabindex="-1"></article>
        <div class="visual" id="visual"></div>
      </div>
    </main>

    <footer class="pager" aria-label="Navegación entre pasos">
      <button id="btnPrev" class="prev"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span class="pager-text"><small>Anterior</small><span class="prev-title"></span></span></button>
      <div class="step-status" id="stepStatus" aria-live="polite"></div>
      <button id="btnNext" class="next primary"><span class="pager-text"><small>Siguiente</small><span class="next-title"></span></span><svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p class="hint">
        <span><kbd>←</kbd> <kbd>→</kbd> pasos</span>
        <span><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> parámetros</span>
        <span><kbd>N</kbd> nueva ejecución</span>
        <span><kbd>M</kbd> manipular</span>
      </p>
    </footer>
  </div>

  <div id="tooltip" role="tooltip"></div>



  <script src="app.js"></script>
</body>
</html>
