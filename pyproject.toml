[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algoritmo-ml-kem"
version = "2.0.0"
description = "Implementación educativa en Python de ML-KEM (FIPS 203) con visualizador interactivo"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Denis Valentin Stoyanov D'Antonio" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[project.scripts]
ml-kem-visualizer = "visualizer.server:main"

[tool.setuptools]
packages = ["mlkem", "visualizer"]

[tool.setuptools.package-data]
visualizer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["legacy"]
