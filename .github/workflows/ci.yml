name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.9"
            numpy: "numpy<2"
          - python: "3.13"
            numpy: "numpy>=2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "${{ matrix.numpy }}" -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python -m benchmarks.bench -n 50
