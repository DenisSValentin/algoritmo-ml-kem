name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # uv descarga esta versión de Python, así que no depende de lo que traiga el runner
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # La versión mínima admitida, con NumPy 1.x
          - python: "3.11"
            numpy: "numpy<2"
          # La más reciente, con NumPy 2.x
          - python: "3.15"
            numpy: "numpy>=2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv pip install "${{ matrix.numpy }}"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python -m benchmarks.bench -n 50
